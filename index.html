<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overvåkningsdashbord</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { font-size: 1.8rem; margin-bottom: 24px; text-align: center; }
        .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        .card { background: #1e293b; border-radius: 8px; padding: 20px; border-left: 6px solid #64748b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .card.ok { border-left-color: #22c55e; }
        .card.warning { border-left-color: #eab308; }
        .card.error { border-left-color: #ef4444; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin: 0; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; }
        .ok .status-badge { background: #166534; color: #4ade80; }
        .warning .status-badge { background: #854d0e; color: #fef08a; }
        .error .status-badge { background: #991b1b; color: #fca5a5; }
        .meta { font-size: 0.85rem; color: #94a3b8; margin-top: 12px; border-top: 1px solid #334155; pt: 8px; padding-top: 8px; }
        .error-msg { color: #fca5a5; font-size: 0.85rem; background: #451a1a; padding: 8px; border-radius: 4px; margin-top: 10px; word-break: break-word; }
    </style>
</head>
<body>
    <h1>Systemstatus – Nyhetsovervåking</h1>
    <div id="dashboard" class="grid"><p style="text-align:center; grid-column: 1/-1;">Laster status...</p></div>

<script>
    async function fetchStatus() {
        try {
            const response = await fetch('status.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error("Kunne ikke hente status.json (HTTP " + response.status + ")");
            
            const data = await response.json();
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            if (Object.keys(data).length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Ingen status fundet.</p>';
                return;
            }

            for (const [key, item] of Object.entries(data)) {
                const statusClass = (item.status || 'unknown').toLowerCase();
                const card = document.createElement('div');
                card.className = 'card ' + statusClass;
                
                var errorHtml = item.error_msg ? '<div class="error-msg">⚠️ ' + item.error_msg + '</div>' : '';
                
                card.innerHTML = 
                    '<div class="header-row">' +
                        '<h2 class="card-title">' + (item.name || key) + '</h2>' +
                        '<span class="status-badge">' + (item.status || 'UKJENT') + '</span>' +
                    '</div>' +
                    errorHtml +
                    '<div class="meta">Sidst opdateret: ' + (item.last_updated || 'Ukendt') + '</div>';
                
                container.appendChild(card);
            }
        } catch (err) {
            document.getElementById('dashboard').innerHTML = '<p style="color: #ef4444; text-align:center; grid-column: 1/-1;">Fejl ved indlæsning: ' + err.message + '</p>';
        }
    }

    fetchStatus();
    setInterval(fetchStatus, 30000);
</script>
</body>
</html>
