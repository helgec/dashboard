<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="10">
    <title>Raspberry Pi - Status Dashbord</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.8rem; margin-bottom: 0.2rem; }
        .sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .card { background: #1e293b; border-radius: 10px; padding: 1.25rem; margin-top: 1rem; border: 1px solid #334155; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { margin: 0; font-size: 1.1rem; }
        .badge { padding: 0.25rem 0.65rem; border-radius: 12px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }
        .ok { background: #065f46; color: #34d399; }
        .error { background: #991b1b; color: #f87171; }
        .error-box { margin-top: 0.75rem; background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; padding: 0.5rem; border-radius: 6px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Overvåkingstjenester</h1>
        <p class="sub">Siden oppdateres automatisk hvert 10. sekund</p>
        <div id="grid">
            
        <div class="card">
            <div class="card-header">
                <h3>Nødvarsel-overvåker</h3>
                <span class="badge ok">OK</span>
            </div>
            <p class="sub">Siste sjekk: <strong>2026-10-07 07:24:01</strong></p>
            
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Mattilsynet-overvåker</h3>
                <span class="badge ok">OK</span>
            </div>
            <p class="sub">Siste sjekk: <strong>2026-10-07 07:20:02</strong></p>
            
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Ekstremvær-overvåker</h3>
                <span class="badge ok">OK</span>
            </div>
            <p class="sub">Siste sjekk: <strong>2026-10-07 07:20:01</strong></p>
            
        </div>
        
        </div>
    </div>
</body>
</html>
