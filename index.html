<script>
    async function fetchStatus() {
        try {
            const response = await fetch('status.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error("Kunne ikke hente status.json (HTTP " + response.status + ")");
            
            const data = await response.json();
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            if (Object.keys(data).length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Ingen status fundet.</p>';
                return;
            }

            for (const [key, item] of Object.entries(data)) {
                const statusClass = (item.status || 'unknown').toLowerCase();
                const card = document.createElement('div');
                card.className = 'card ' + statusClass;
                
                var errorHtml = item.error_msg ? '<div class="error-msg">⚠️ ' + item.error_msg + '</div>' : '';
                
                card.innerHTML = 
                    '<div class="header-row">' +
                        '<h2 class="card-title">' + (item.name || key) + '</h2>' +
                        '<span class="status-badge">' + (item.status || 'UKJENT') + '</span>' +
                    '</div>' +
                    errorHtml +
                    '<div class="meta">Sidst opdateret: ' + (item.last_updated || 'Ukendt') + '</div>';
                
                container.appendChild(card);
            }
        } catch (err) {
            document.getElementById('dashboard').innerHTML = '<p style="color: #ef4444; text-align:center; grid-column: 1/-1;">Fejl ved indlæsning: ' + err.message + '</p>';
        }
    }

    fetchStatus();
    setInterval(fetchStatus, 30000);
</script>
